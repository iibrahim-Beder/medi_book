name: medi_book
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.6.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # A feature-rich audio player for Flutter. Loop, clip and sequence any sound from any source (asset/file/URL/stream) in gapless playlists.
  just_audio: ^0.10.5

 # A Dart port of the S2 Geometry Library from JavaScript, providing utilities for geographic calculations and conversions.
  # s2geometry_dart: ^0.0.3
  # s2geometry: ^0.0.5
  # s2geometry: ^0.1.1
  h3_flutter: ^0.7.0
  h3_dart: ^0.7.0

  # A package that provides a sheet widget that snaps to different vertical & horizontal positions
  snapping_sheet: ^3.1.0


  # Simple Flutter clustering library for Google Maps based on Geohash.
  # google_maps_cluster_manager: ^3.1.0
  google_maps_cluster_manager_2: ^3.2.0

  
  http: ^1.5.0
 
  image: ^4.5.4

 # Geolocation plugin for Flutter. This plugin provides a cross-platform (iOS, Android) API for generic location (GPS etc.) functions.
  geolocator: ^14.0.2

  
 # A Flutter plugin for integrating Google Maps in iOS and Android applications.
  google_maps_flutter: ^2.12.3
  # # google_maps_flutter: 2.8.0
  # google_maps_flutter: 2.1.8
  # google_maps_flutter: 2.0.10


  overlay_support: ^2.0.1

  # A highly customizable, powerful and easy-to-use alerting library for Flutter.
  another_flushbar: ^1.12.30

  # Extension for Hive. Makes it easier to use Hive in Flutter apps.
  hive_flutter: ^1.1.0
  
  #Lightweight and blazing fast key-value database written in pure Dart. Strongly encrypted using AES-256.
  hive: ^2.2.3


  # Flutter plugin for Firebase Cloud Messaging, a cross-platform messaging solution that lets you reliably deliver messages on Android and iOS.
  firebase_messaging: ^16.0.0


  # Flutter plugin for Firebase Core, enabling connecting to multiple Firebase apps.
  firebase_core: ^4.0.0

  # Flutter plugin for Cloud Firestore, a cloud-hosted, noSQL database with live synchronization and offline support on Android and iOS.
  cloud_firestore: ^6.0.1

  # A cross platform plugin for displaying and scheduling local notifications for Flutter applications with the ability to customise for each platform.
  flutter_local_notifications: ^19.4.0


  # audioplayers: ^6.5.0
  # flutter_audio_waveforms: ^1.2.1+8
  audio_waveforms: ^1.3.0

  # Flutter plugin for getting commonly used locations on host platform file systems, such as the temp and app data directories.
  path_provider: ^2.1.5

  #Audio recorder from microphone to file or stream with multiple codecs, bit rate and sampling rate options.
  record: ^6.0.0
  permission_handler: ^12.0.1
  

  # A custom switch widget that can have a custom height and width, borders, border radius, colors, toggle size, custom text and icons inside the toggle.
  flutter_switch: ^0.3.2
  
  # A library useful for creating fuzzy timestamps. (e.g. "15 minutes ago")
  timeago: ^3.7.1

  # This is a cached image widget that provides a simple way to display images from a remote URL.
  cached_network_image: ^3.4.1

  # This shimmer animation widget can help you bring simple yet beautiful skeleton loaders to your project with ease.
  shimmer: ^3.0.0

  # A carousel slider widget, support infinite scroll and custom child widget.
  carousel_slider: ^5.0.0

  # the following adds the flutter_rating_bar
  flutter_rating_bar: ^4.0.1

  # The following adds ability to move to selected items in a list "index-based scroll"
  scrollable_positioned_list: ^0.3.8

  # Functional Programming in Dart. Purify your Dart code using efficient immutable data structures, monads, lenses and other FP tools.
  dartz: ^0.10.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
   

  # A build system for Dart code generation and modular compilation.
  build_runner: ^2.4.15

  
  # State management
  flutter_bloc: ^9.1.0

  # Cood generator (commonly used with a cubit and retrofit)
  freezed_annotation: ^2.4.1
  
  # Dimensions injection
  get_it: ^8.0.3

  # A library for automatically generating code to convert Dart objects to and from JSON.
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0
  
  # Networking
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  pretty_dio_logger: ^1.4.0

  # # Localisation
  # intl: ^0.19.0
  # easy_localization: ^3.0.7+1

  # for splash screen
  flutter_native_splash: ^2.4.4
  
  # An SVG rendering and widget library for Flutter, which allows painting and displaying Scalable Vector Graphics 1.1 files.
  flutter_svg: ^2.0.17
   
  # A flutter plugin for adapting screen and font size.Guaranteed to look good on different models
  flutter_screenutil: ^5.9.3
  
  # for Navigation between screen
  go_router: ^14.8.1

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Code generator, so it belongs in dev_dependencies
  retrofit_generator: ^9.1.9  
  freezed: ^2.4.6
  
  # Extension for Hive. Automatically generates TypeAdapters to store any class.
  hive_generator: ^2.0.1



  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

